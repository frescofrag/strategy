site_name: "FrescoFrag Strategy"
site_description: "Senior IT Architect & Martial Artist. Strategie tattiche, Game Theory e analisi logica del gameplay."
site_author: "FrescoFrag"
site_url: "https://frescofrag.github.io/strategy"

theme:
  name: material
  language: "it"
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for automatic mode (https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#automatic-light-dark-mode)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

extra:
  analytics:
    provider: google
    property: G-LEC8TW0Y90
  consent:
    title: Cookie consent
    description: >-
      Utilizziamo i cookie per riconoscere le tue visite ripetute e le tue preferenze, nonché per misurare l'efficacia della nostra documentazione e per verificare se gli utenti trovano ciò che cercano. Con il tuo consenso, ci aiuti a migliorare la nostra documentazione.
  social:
    - icon: fontawesome/brands/twitch
      link: https://twitch.tv/FrescoFrag
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@FrescoFrag
    # - icon: fontawesome/brands/discord
    #   link: https://discord.gg/FrescoFrag

nav:
  - Home: index.md
  - 🛡️ Tactics & Builds:
      - "Dune: Awakening Guide": operations/tactics/dune-awakening.md
      - "Dune: Imperium Guide": operations/tactics/dune-imperium.md
      - "Build: Industrial Breacher": operations/tactics/dune-awakening-build-industrial-breacher.md
      # - "Build: Tactical Executioner": operations/tactics/dune-awakening-build-tactical-executioner.md
  - 🛰️ Platform Protocols:
      - "Mission Schedule": operations/operational-schedule.md
      - "Chat Rules": platforms/twitch-rules.md
  - 🏗️ Infrastructure:
      - "Streaming Stack": architecture/streaming-stack.md
      - "Hardware Setup": architecture/hardware-setup.md
